<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wayan｜蝦皮違規管理</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#172033;background:#f3f5f9}*{box-sizing:border-box}body{margin:0}.top{background:#172b4d;color:white;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}.top a{color:white}.wrap{max-width:1280px;margin:22px auto;padding:0 16px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tabs button,.btn{border:0;border-radius:8px;padding:10px 14px;background:#24466f;color:white;cursor:pointer}.tabs button.active{background:#087e8b}.panel{display:none;background:white;border:1px solid #dce2ec;border-radius:12px;padding:18px;margin-bottom:16px}.panel.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}label{display:block;font-size:13px;color:#536179;margin:8px 0 4px}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd4e1;border-radius:7px;font:inherit}textarea{min-height:76px}table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}th,td{padding:10px;border-bottom:1px solid #e5e9f0;text-align:left;vertical-align:top}th{background:#f5f7fa;white-space:nowrap}.muted{color:#66758b;font-size:13px}.status{display:inline-block;padding:3px 8px;border-radius:20px;background:#edf2f7;font-size:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.notice{padding:10px;border-radius:8px;margin:12px 0;background:#eef6ff;color:#19456b}.danger{background:#fff1f0;color:#9a2d25}.hidden{display:none!important}.actions button{margin:2px;padding:6px 9px}.empty{padding:24px;text-align:center;color:#718096}@media(max-width:700px){.wrap{padding:0 10px}.panel{padding:12px;overflow-x:auto}table{min-width:720px}.top{padding:14px}}
</style>
</head>
<body>
<header class="top"><strong>Wayan｜蝦皮違規管理</strong><a href="/">返回 Wayan 主系統</a></header>
<main class="wrap">
<div id="msg" class="notice hidden"></div>
<p class="muted">案件、規則及罰款均以 Wayan 資料庫為準。未經主管覆核不產生罰款或績效扣分；罰款僅登記及人工確認，不會自動扣款。</p>
<nav class="tabs">
<button class="active" data-tab="cases">違規案件</button><button data-tab="rules">規則條款</button><button data-tab="versions">規則版本</button><button data-tab="appeals">申訴紀錄</button>
</nav>
<section id="cases" class="panel active">
<h2>建立違規案件</h2>
<form id="caseForm">
<div class="grid">
<div><label>車隊（可留空）</label><select id="fleet"><option value="">不指定車隊</option></select></div>
<div><label>自有司機（可留空）</label><select id="driver"><option value="">不指定司機</option></select></div>
<div><label>關聯港口車趟（可留空）</label><select id="order"><option value="">不指定港口車趟</option></select></div>
<div><label>蝦皮路線（可留空）</label><select id="route"><option value="">不指定蝦皮路線</option></select></div>
<div><label>蝦皮分派紀錄 ID（選路線後填寫）</label><input id="assignment" type="number" min="1" placeholder="選填"></div>
<div><label>違規條款</label><select id="caseRule" required></select></div>
<div><label>事件日期時間</label><input id="eventAt" type="datetime-local" required></div>
</div>
<label>事件描述</label><textarea id="description" required maxlength="3000"></textarea>
<label>證據說明（第一階段先記錄文字，不上傳附件）</label><textarea id="evidence" maxlength="2000"></textarea>
<p><button class="btn">建立待覆核案件</button></p>
</form>
<h2>案件清單</h2><div class="row"><input id="caseSearch" placeholder="搜尋案件編號、車隊、司機或描述"><button class="btn" id="reloadCases" type="button">重新整理</button></div>
<div id="caseTable"></div>
</section>
<section id="rules" class="panel">
<h2>新增違規條款（管理員）</h2>
<form id="ruleForm"><div class="grid">
<div><label>所屬版本</label><select id="ruleVersion" required></select></div>
<div><label>規則代碼</label><input id="ruleCode" required maxlength="60"></div>
<div><label>分類</label><select id="ruleCategory" required></select></div>
<div><label>適用對象</label><input id="applicable" placeholder="例如：合作車隊／自有司機"></div>
<div><label>來源頁碼</label><input id="sourcePage" type="number" min="1" required></div>
</div><label>條款原文（請依正式文件逐字核對）</label><textarea id="ruleText" required maxlength="3000"></textarea><p><button class="btn">新增待核對條款</button></p></form>
<div id="ruleTable"></div>
</section>
<section id="versions" class="panel">
<h2>新增規則版本（管理員）</h2>
<form id="versionForm"><div class="grid">
<div><label>版本名稱</label><input id="versionName" required></div><div><label>來源文件</label><input id="sourceDocument" required></div>
<div><label>文件更新日期</label><input id="documentDate" type="date"></div><div><label>生效日期</label><input id="effectiveDate" type="date" required></div><div><label>失效日期</label><input id="expiryDate" type="date"></div>
</div><p><button class="btn">建立草稿版本</button></p></form><div id="versionTable"></div>
</section>
<section id="appeals" class="panel"><h2>申訴紀錄</h2><p class="muted">從案件清單選擇案件可提出申訴；管理員可於案件歷程中查看與審查。</p><div id="appealTable"></div></section>
</main>
<script>
const token=localStorage.getItem("token"),role=localStorage.getItem("role");
const $=id=>document.getElementById(id);
const api=async(path,opts={})=>{const r=await fetch("/api/shopee/violations"+path,{...opts,headers:{"Content-Type":"application/json",Authorization:"Bearer "+token,...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"操作失敗");return d};
const post=(path,data)=>api(path,{method:"POST",body:JSON.stringify(data)});
const patch=(path,data)=>api(path,{method:"PATCH",body:JSON.stringify(data)});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const msg=(s,bad=false)=>{$("msg").textContent=s;$("msg").className="notice"+(bad?" danger":"");$("msg").classList.remove("hidden");};
const options=(el,rows,label,value)=>{el.innerHTML=rows.map(x=>'<option value="'+esc(x[value])+'">'+esc(x[label])+'</option>').join("");};
let rules=[],versions=[],cases=[],categories=[];
if(!token){msg("請先登入 Wayan，再開啟違規管理頁面。",true);throw Error("No login token");}
if(role!=="admin") { $("ruleForm").classList.add("hidden"); $("versionForm").classList.add("hidden"); }
document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll("[data-tab],.panel").forEach(x=>x.classList.remove("active"));b.classList.add("active");$(b.dataset.tab).classList.add("active");}));
async function load(){
 try{
  const [meta,rs,cs,ds,os,sh]=await Promise.all([api("/meta"),api("/rules"),api("/cases"),fetch("/api/shopee/fleets",{headers:{Authorization:"Bearer "+token}}).then(r=>r.ok?r.json():[]),fetch("/api/orders",{headers:{Authorization:"Bearer "+token}}).then(r=>r.ok?r.json():[]),api("/../shopee/routes").catch(()=>[])]);
  categories=meta.categories;rules=rs;cases=cs;
  $("ruleCategory").innerHTML=categories.map(x=>'<option>'+esc(x)+'</option>').join("");
  $("caseRule").innerHTML=rules.filter(x=>x.verification_status==="已核對"&&x.version_status==="已核准").map(x=>'<option value="'+x.id+'">'+esc(x.rule_code+"｜"+x.category+"｜"+x.rule_text.slice(0,45))+'</option>').join("");
  const fleetRows=Array.isArray(ds)?ds:(ds.fleets||[]);$("fleet").innerHTML='<option value="">不指定車隊</option>'+fleetRows.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join("");
  $("driver").innerHTML='<option value="">不指定司機</option>'+osDriversPlaceholder();
  $("order").innerHTML='<option value="">不指定港口車趟</option>'+os.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.id+"｜"+(x.container||""))+'</option>').join("");
  $("route").innerHTML='<option value="">不指定蝦皮路線</option>'+(Array.isArray(sh)?sh:[]).map(x=>'<option value="'+esc(x.id)+'">'+esc(x.origin+"→"+x.destination+"｜"+x.serviceDate)+'</option>').join("");
  renderCases();renderRules();
  if(role==="admin"){versions=await api("/versions");renderVersions();}
 }catch(e){msg(e.message,true);}
}
function osDriversPlaceholder(){return "";}
function renderCases(){
 const q=$("caseSearch").value.toLowerCase(),rows=cases.filter(x=>(x.case_no+" "+(x.fleet_name||"")+" "+(x.driver_name||"")+" "+x.description).toLowerCase().includes(q));
 $("caseTable").innerHTML=rows.length?'<table><thead><tr><th>案件編號／時間</th><th>車隊／司機</th><th>條款</th><th>關聯車趟</th><th>責任／狀態</th><th>操作</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+esc(x.case_no)+'<br><small>'+esc(x.event_at)+'</small></td><td>'+esc(x.fleet_name||"—")+'<br>'+esc(x.driver_name||"—")+'</td><td>'+esc(x.rule_code)+'<br>'+esc(x.category)+'</td><td>'+esc(x.order_id||x.shopee_route_id||"—")+'</td><td>'+esc(x.responsibility||"待覆核")+'<br>'+esc(x.status)+'</td><td class="actions">'+(role==="admin"?'<button data-review="'+x.id+'">主管覆核</button><button data-fine="'+x.id+'">登記罰款</button>':'')+'<button data-appeal="'+x.id+'">提出申訴</button><button data-events="'+x.id+'">查看歷程</button></td></tr>').join("")+'</tbody></table>':'<div class="empty">目前沒有案件</div>';
 $("caseTable").querySelectorAll("[data-review]").forEach(b=>b.onclick=async()=>{const decision=prompt("責任判定：待確認／全責／部分責任／無責");if(!decision)return;const reason=prompt("請輸入主管覆核理由");if(!reason)return;try{await patch("/cases/"+b.dataset.review+"/review",{decision,reason});msg("主管覆核已記錄");await load();}catch(e){msg(e.message,true);}});
 $("caseTable").querySelectorAll("[data-fine]").forEach(b=>b.onclick=async()=>{const payer_type=prompt("開罰對象：我方 或 合作車隊");const amount=Number(prompt("罰款金額（TWD）"));const source_reference=prompt("蝦皮通知／罰單單號");if(!payer_type||!source_reference||!Number.isFinite(amount))return;try{await post("/cases/"+b.dataset.fine+"/fines",{payer_type,amount,source_reference});msg("罰款明細已新增，狀態為待人工確認");}catch(e){msg(e.message,true);}});
 $("caseTable").querySelectorAll("[data-appeal]").forEach(b=>b.onclick=async()=>{const appeal_text=prompt("請輸入申訴內容");if(!appeal_text)return;try{await post("/cases/"+b.dataset.appeal+"/appeals",{appeal_text});msg("申訴已建立");await load();}catch(e){msg(e.message,true);}});
 $("caseTable").querySelectorAll("[data-events]").forEach(b=>b.onclick=async()=>{try{const e=await api("/cases/"+b.dataset.events+"/events");alert(e.map(x=>x.created_at+"｜"+x.event_type+"｜"+x.description+"｜"+x.actor).join("\n"));}catch(err){msg(err.message,true);}});
}
function renderRules(){$("ruleTable").innerHTML=rules.length?'<table><tr><th>代碼</th><th>分類</th><th>版本</th><th>核對狀態</th><th>操作</th></tr>'+rules.map(x=>'<tr><td>'+esc(x.rule_code)+'</td><td>'+esc(x.category)+'</td><td>'+esc(x.version_name)+'</td><td>'+esc(x.verification_status)+'</td><td>'+(role==="admin"&&x.verification_status!=="已核對"?'<button data-verify="'+x.id+'">標記已核對</button>':'')+'</td></tr>').join("")+'</table>':'<div class="empty">尚無條款</div>';$("ruleTable").querySelectorAll("[data-verify]").forEach(b=>b.onclick=async()=>{if(!confirm("請先確認條款原文與來源頁碼無誤。確定標記已核對？"))return;try{await patch("/rules/"+b.dataset.verify+"/verify",{verification_status:"已核對"});await load();}catch(e){msg(e.message,true);}});}
function renderVersions(){$("ruleVersion").innerHTML=versions.map(x=>'<option value="'+x.id+'">'+esc(x.version_name+"｜"+x.status)+'</option>').join("");$("versionTable").innerHTML=versions.length?'<table><tr><th>版本</th><th>來源</th><th>生效日</th><th>狀態</th><th>操作</th></tr>'+versions.map(x=>'<tr><td>'+esc(x.version_name)+'</td><td>'+esc(x.source_document)+'</td><td>'+esc(x.effective_date)+'</td><td>'+esc(x.status)+'</td><td>'+(x.status==="草稿"||x.status==="待覆核"?'<button data-approve="'+x.id+'">核准版本</button>':'')+'</td></tr>').join("")+'</table>':'<div class="empty">尚無版本</div>';$("versionTable").querySelectorAll("[data-approve]").forEach(b=>b.onclick=async()=>{if(!confirm("請確認版本內所有條款均已逐條核對。確定核准？"))return;try{await post("/versions/"+b.dataset.approve+"/approve",{});await load();}catch(e){msg(e.message,true);}});}
$("caseForm").onsubmit=async e=>{e.preventDefault();try{const payload={fleet_id:$("fleet").value,driver_id:$("driver").value,order_id:$("order").value,shopee_route_id:$("route").value,assignment_id:$("assignment").value||null,rule_id:$("caseRule").value,event_at:$("eventAt").value,description:$("description").value,evidence_note:$("evidence").value};await post("/cases",payload);e.target.reset();msg("違規案件已建立，等待主管覆核");await load();}catch(err){msg(err.message,true);}};
$("versionForm").onsubmit=async e=>{e.preventDefault();try{await post("/versions",{version_name:$("versionName").value,source_document:$("sourceDocument").value,document_updated_at:$("documentDate").value||null,effective_date:$("effectiveDate").value,expiry_date:$("expiryDate").value||null});e.target.reset();msg("草稿版本已建立");await load();}catch(err){msg(err.message,true);}};
$("ruleForm").onsubmit=async e=>{e.preventDefault();try{await post("/rules",{version_id:$("ruleVersion").value,rule_code:$("ruleCode").value,category:$("ruleCategory").value,applicable_to:$("applicable").value,source_page:$("sourcePage").value,rule_text:$("ruleText").value});e.target.reset();msg("條款已建立，預設待核對");await load();}catch(err){msg(err.message,true);}};
$("caseSearch").oninput=renderCases;$("reloadCases").onclick=load;
load();
</script>
</body></html>
